<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="robots" content="noindex, nofollow">
    <title>Log in · Bleet</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="assets/style/global.css">
    <link rel="stylesheet" href="assets/style/auth.css">
</head>

<body class="auth-body">

    <header class="auth-top">
        <a class="auth-brand" href="index.html" aria-label="Bleet home">
            <img src="assets/images/black-logo.webp" alt="Bleet" height="32">
        </a>
        <a class="auth-back" href="index.html">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>Back to home
        </a>
    </header>

    <main class="auth-main" id="main">
        <section class="auth-card" aria-labelledby="loginTitle">
            <p class="kicker">Welcome back</p>
            <h1 id="loginTitle">Log in to Bleet</h1>
            <p class="auth-lead">Manage your bookings, travellers and payments in one place.</p>

            <div class="auth-alert" id="authAlert" role="alert" hidden></div>

            <form class="auth-form" data-auth="login" novalidate>
                <div class="auth-field">
                    <label for="loginEmail">Email</label>
                    <div class="auth-control">
                        <i class="fa-regular fa-envelope" aria-hidden="true"></i>
                        <input id="loginEmail" name="email" type="email" autocomplete="username" required
                            maxlength="254" spellcheck="false" inputmode="email">
                    </div>
                    <span class="auth-error" aria-live="polite"></span>
                </div>

                <div class="auth-field">
                    <div class="auth-label-row">
                        <label for="loginPassword">Password</label>
                        <a href="page.html?p=support">Forgot password?</a>
                    </div>
                    <div class="auth-control">
                        <i class="fa-solid fa-lock" aria-hidden="true"></i>
                        <input id="loginPassword" name="password" type="password" autocomplete="current-password"
                            required maxlength="128">
                        <button class="pw-toggle" type="button" data-toggle-password aria-label="Show password"
                            aria-pressed="false">
                            <i class="fa-solid fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <p class="caps-hint" data-caps hidden>Caps Lock is on.</p>
                    <span class="auth-error" aria-live="polite"></span>
                </div>

                <div class="auth-field">
                    <label class="check">
                        <input type="checkbox" name="remember">
                        <span>Keep me signed in on this device</span>
                    </label>
                </div>

                <!-- Honeypot: keep empty -->
                <div class="hp" aria-hidden="true">
                    <label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
                </div>

                <button class="btn btn-primary btn-lg btn-block" type="submit">Log in</button>
            </form>

            <p class="auth-switch">New to Bleet? <a href="signup.html">Create an account</a></p>
        </section>
    </main>

    <script src="assets/logic/common.js" defer></script>
    <script src="assets/logic/api.js" defer></script>
    <script src="assets/logic/auth.js" defer></script>
</body>

</html>
