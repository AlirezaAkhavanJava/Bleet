<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="robots" content="noindex, nofollow">
    <title>Create account · Bleet</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="assets/style/global.css">
    <link rel="stylesheet" href="assets/style/auth.css">
</head>

<body class="auth-body">

    <header class="auth-top">
        <a class="auth-brand" href="index.html" aria-label="Bleet home">
            <img src="assets/images/black-logo.webp" alt="Bleet" height="32">
        </a>
        <a class="auth-back" href="index.html">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>Back to home
        </a>
    </header>

    <main class="auth-main" id="main">
        <section class="auth-card" aria-labelledby="signupTitle">
            <p class="kicker">Join Bleet</p>
            <h1 id="signupTitle">Create your account</h1>
            <p class="auth-lead">Save travellers, track bookings and get deals on the routes you search.</p>

            <div class="auth-alert" id="authAlert" role="alert" hidden></div>

            <form class="auth-form" data-auth="signup" novalidate>
                <div class="auth-field">
                    <label for="signupName">Full name</label>
                    <div class="auth-control">
                        <i class="fa-regular fa-user" aria-hidden="true"></i>
                        <input id="signupName" name="name" type="text" autocomplete="name" required maxlength="100">
                    </div>
                    <span class="auth-error" aria-live="polite"></span>
                </div>

                <div class="auth-field">
                    <label for="signupEmail">Email</label>
                    <div class="auth-control">
                        <i class="fa-regular fa-envelope" aria-hidden="true"></i>
                        <input id="signupEmail" name="email" type="email" autocomplete="email" required maxlength="254"
                            spellcheck="false" inputmode="email">
                    </div>
                    <span class="auth-error" aria-live="polite"></span>
                </div>

                <div class="auth-field">
                    <label for="signupPhone">Phone <span class="auth-note">(optional)</span></label>
                    <div class="auth-control">
                        <i class="fa-solid fa-phone" aria-hidden="true"></i>
                        <input id="signupPhone" name="phone" type="tel" autocomplete="tel" maxlength="20">
                    </div>
                    <span class="auth-error" aria-live="polite"></span>
                </div>

                <div class="auth-field">
                    <label for="signupPassword">Password</label>
                    <div class="auth-control">
                        <i class="fa-solid fa-lock" aria-hidden="true"></i>
                        <input id="signupPassword" name="password" type="password" autocomplete="new-password" required
                            minlength="12" maxlength="128">
                        <button class="pw-toggle" type="button" data-toggle-password aria-label="Show password"
                            aria-pressed="false">
                            <i class="fa-solid fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div class="auth-meter" data-meter data-level="0" aria-hidden="true">
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <p class="auth-meter-label" data-meter-label aria-live="polite"></p>
                    <p class="caps-hint" data-caps hidden>Caps Lock is on.</p>
                    <span class="auth-error" aria-live="polite"></span>
                </div>

                <div class="auth-field">
                    <label for="signupConfirm">Confirm password</label>
                    <div class="auth-control">
                        <i class="fa-solid fa-lock" aria-hidden="true"></i>
                        <input id="signupConfirm" name="confirm" type="password" autocomplete="new-password" required
                            maxlength="128">
                    </div>
                    <span class="auth-error" aria-live="polite"></span>
                </div>

                <div class="auth-field">
                    <label class="check">
                        <input type="checkbox" name="terms" required>
                        <span>I agree to the <a href="page.html?p=privacy">Privacy Policy</a> and terms of use.</span>
                    </label>
                    <span class="auth-error" aria-live="polite"></span>
                </div>

                <div class="auth-field">
                    <label class="check">
                        <input type="checkbox" name="marketing">
                        <span>Send me travel deals and news. You can change this anytime.</span>
                    </label>
                </div>

                <!-- Honeypot: keep empty -->
                <div class="hp" aria-hidden="true">
                    <label>Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
                </div>

                <button class="btn btn-primary btn-lg btn-block" type="submit">Create account</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
        </section>
    </main>

    <script src="assets/logic/common.js" defer></script>
    <script src="assets/logic/api.js" defer></script>
    <script src="assets/logic/auth.js" defer></script>
</body>

</html>
