<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bleet Header - Hero Search</title>

    <!-- Google Fonts: Barlow Condensed -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS Files -->
    <link rel="stylesheet" href="/assets/style/global.css">
    <link rel="stylesheet" href="/assets/style/heading.css">
    <link rel="stylesheet" href="/assets/style/hero-search.css">
    <link rel="stylesheet" href="/assets/style/header-animations.css">
    <link rel="stylesheet" href="/assets/style/hero-animations.css">
</head>

<body>

    <!-- ==========================================
         TOP NAVIGATION BAR
         ========================================== -->
    <header class="top-header">
        <div class="container-fluid px-4 d-flex align-items-center justify-content-between" style="height: 72px; max-width: 1400px; margin: 0 auto;">

            <!-- Logo -->
            <a href="#" class="brand-logo d-flex align-items-center text-decoration-none">
                <img src="/assets/images/black-logo.webp" alt="Bleet Logo" style="height: 36px; width: auto;">
            </a>

            <!-- Main Navigation Links (Desktop) -->
            <nav class="d-none d-lg-flex align-items-center gap-2">
                <a href="#" class="nav-link active">
                    <span class="nav-icon"><i class="fa-solid fa-plane"></i></span> Flights
                    <i class="fa-solid fa-chevron-down ms-1" style="font-size: 0.7rem; margin-left: 4px;"></i>
                </a>
                <a href="#" class="nav-link">
                    <span class="nav-icon"><i class="fa-solid fa-train"></i></span> Trains
                </a>
                <a href="#" class="nav-link">
                    <span class="nav-icon"><i class="fa-solid fa-bus"></i></span> Buses
                </a>
                <a href="#" class="nav-link">
                    <span class="nav-icon"><i class="fa-solid fa-hotel"></i></span> Hotels
                    <i class="fa-solid fa-chevron-down ms-1" style="font-size: 0.7rem; margin-left: 4px;"></i>
                </a>
                <a href="#" class="nav-link">
                    <span class="nav-icon"><i class="fa-solid fa-map-location-dot"></i></span> Tours
                </a>
                <a href="#" class="nav-link">
                    <span class="nav-icon"><i class="fa-solid fa-passport"></i></span> Visa
                </a>
                <a href="#" class="nav-link">
                    <span class="nav-icon"><i class="fa-solid fa-briefcase"></i></span> Agency Panel
                </a>
                <a href="#" class="nav-link">
                    <span class="nav-icon"><i class="fa-solid fa-ellipsis"></i></span> More
                    <i class="fa-solid fa-chevron-down ms-1" style="font-size: 0.7rem; margin-left: 4px;"></i>
                </a>
            </nav>

            <!-- Right Side Actions (Login & Support) -->
            <div class="d-flex align-items-center gap-4 ms-auto ms-lg-0">
                <button class="btn-outline d-flex align-items-center gap-2">
                    <i class="fa-solid fa-user"></i> Login / Sign Up
                </button>
                <div class="d-none d-sm-flex align-items-center">
                    <a href="#" class="icon-link" title="Support">
                        <i class="fa-solid fa-headset"></i> Support
                    </a>
                </div>
            </div>

        </div>
    </header>

    <!-- ==========================================
         MAIN CONTENT AREA
         ========================================== -->
    <main class="container-fluid px-4 py-4" style="max-width: 1400px; margin: 0 auto;">
        
        <!-- Hero Section -->
        <section class="hero" aria-labelledby="hero-title">
            
            <!-- Background Image & Overlay -->
            <img class="hero-image" src="/assets/images/hero-banner.webp" alt="Airplane wing above the clouds" fetchpriority="high" loading="eager" decoding="async">
            
            <!-- Hero Text Content -->
            <div class="hero-content">
                <div class="eyebrow">
                    <span aria-hidden="true">✦</span>
                    <span data-i18n="badge">Your Next Journey Awaits</span>
                </div>
                <h1 id="hero-title">
                    <span data-i18n="hero_title_1">Discover the World</span>
                    <span data-i18n="hero_title_2">Fly with Bleet</span>
                </h1>
                <p data-i18n="hero_subtitle">Book flights easily, compare prices, and explore the best destinations around the globe.</p>
            </div>

            <!-- ==========================================
                 SEARCH PANEL (Overlapping Hero)
                 ========================================== -->
            <div class="search-panel" aria-label="Flight search">
                
                <!-- Trip Type Options -->
                <div class="flight-options" role="group" aria-label="Trip type">
                    <button class="active" type="button">
                        <i class="fa-solid fa-plane-departure"></i>
                        <span data-i18n="one_way">One Way</span>
                    </button>
                    <button type="button">
                        <i class="fa-solid fa-arrow-right-arrow-left"></i>
                        <span data-i18n="round_trip">Round Trip</span>
                    </button>
                    <button type="button">
                        <i class="fa-solid fa-map-location-dot"></i>
                        <span data-i18n="multi_city">Multi-City</span>
                    </button>
                </div>

                <!-- Flight Search Form -->
                <form class="search-row" id="flightSearchForm">
                    
                    <!-- From Field -->
                    <div class="search-field">
                        <div class="input-wrapper">
                            <i class="fa-solid fa-location-dot"></i>
                            <input id="fromCity" type="text" placeholder="From where?" data-i18n-placeholder="from_placeholder" autocomplete="off" required>
                        </div>
                    </div>
                    
                    <!-- Swap Button -->
                    <button class="swap-btn" id="swapCities" type="button" aria-label="Swap departure and destination">
                        <i class="fa-solid fa-right-left"></i>
                    </button>
                    
                    <!-- To Field -->
                    <div class="search-field">
                        <div class="input-wrapper">
                            <i class="fa-solid fa-location-dot"></i>
                            <input id="toCity" type="text" placeholder="Where to?" data-i18n-placeholder="to_placeholder" autocomplete="off" required>
                        </div>
                    </div>
                    
                    <!-- Departure Date Field -->
                    <div class="search-field">
                        <div class="input-wrapper date-control">
                            <i class="fa-regular fa-calendar"></i>
                            <input id="departureDate" type="date" value="2026-12-10" required aria-label="Departure date">
                        </div>
                    </div>
                    
                    <!-- Passengers Field -->
                    <div class="search-field">
                        <div class="input-wrapper">
                            <i class="fa-solid fa-user-group"></i>
                            <select id="passengerCount">
                                <option value="1" data-i18n="passenger_1">1 Adult</option>
                                <option value="2" data-i18n="passenger_2">2 Adults</option>
                                <option value="3" data-i18n="passenger_3">3 Adults</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- Submit Button -->
                    <button class="search-btn" type="submit">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <span data-i18n="search_flights">Search</span>
                    </button>

                </form>
            </div>
        </section>
    </main>

    <!-- JavaScript -->
    <script src="/assets/logic/index.js"></script>
</body>

</html>
