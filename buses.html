<title>Buses · Bleet</title>
<!-- body: <body class="theme-buses"> -->

<main id="main">
    <section class="svc-hero">
        <div class="container">
            <p class="kicker">Buses</p>
            <h1>Travel by coach</h1>
            <p class="lead">Compare intercity coaches, seat types and departure times.</p>
        </div>
    </section>

    <section class="container">
        <form class="svc-panel" data-service-form="buses" novalidate aria-label="Bus search">
            <div class="svc-top">
                <div class="segmented" role="radiogroup" aria-label="Trip type">
                    <input type="radio" id="busOneWay" name="trip" value="oneway" checked>
                    <label for="busOneWay">One way</label>
                    <input type="radio" id="busReturn" name="trip" value="return">
                    <label for="busReturn">Return</label>
                </div>
            </div>

            <div class="svc-fields">
                <div class="svc-field is-wide">
                    <label class="svc-label" for="busFrom">From</label>
                    <div class="svc-control">
                        <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                        <input id="busFrom" name="from" type="text" placeholder="Departure city or stop"
                            autocomplete="off" required data-msg="Enter a departure city.">
                    </div>
                    <span class="svc-error" aria-live="polite"></span>
                </div>

                <button class="svc-swap" type="button" aria-label="Swap cities">
                    <i class="fa-solid fa-right-left" aria-hidden="true"></i>
                </button>

                <div class="svc-field is-wide">
                    <label class="svc-label" for="busTo">To</label>
                    <div class="svc-control">
                        <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                        <input id="busTo" name="to" type="text" placeholder="Arrival city or stop" autocomplete="off"
                            required data-msg="Enter a destination city.">
                    </div>
                    <span class="svc-error" aria-live="polite"></span>
                </div>

                <div class="svc-field">
                    <label class="svc-label" for="busDate">Departure</label>
                    <div class="svc-control">
                        <i class="fa-regular fa-calendar" aria-hidden="true"></i>
                        <input id="busDate" name="date" type="date" data-offset="7" required
                            data-msg="Choose a departure date." data-msg-range="Date can't be in the past.">
                    </div>
                    <span class="svc-error" aria-live="polite"></span>
                </div>

                <div class="svc-field is-return-only">
                    <label class="svc-label" for="busReturnDate">Return</label>
                    <div class="svc-control">
                        <i class="fa-regular fa-calendar" aria-hidden="true"></i>
                        <input id="busReturnDate" name="return" type="date" data-after="busDate" data-offset="14"
                            data-return disabled required data-msg="Choose a return date."
                            data-msg-range="Return must be on or after departure.">
                    </div>
                    <span class="svc-error" aria-live="polite"></span>
                </div>

                <div class="svc-field picker" data-total-max="10">
                    <span class="svc-label" id="busPaxLabel">Passengers</span>
                    <button class="picker-trigger" type="button" aria-haspopup="dialog" aria-expanded="false"
                        aria-controls="busPax" aria-labelledby="busPaxLabel picker-busSummary">
                        <i class="fa-solid fa-user-group" aria-hidden="true"></i>
                        <span class="picker-summary" id="picker-busSummary">1 Adult</span>
                        <i class="fa-solid fa-chevron-down picker-chevron" aria-hidden="true"></i>
                    </button>

                    <div class="picker-panel" id="busPax" role="dialog" aria-label="Passengers">
                        <div class="counter-row" data-key="adults" data-min="1" data-max="10" data-start="1"
                            data-one="Adult" data-many="Adults">
                            <div><strong>Adults</strong><small>13 years and over</small></div>
                            <div class="counter">
                                <button class="counter-btn" type="button" data-action="dec"
                                    aria-label="Remove an adult">&minus;</button>
                                <output>1</output>
                                <button class="counter-btn" type="button" data-action="inc"
                                    aria-label="Add an adult">+</button>
                            </div>
                        </div>
                        <div class="counter-row" data-key="children" data-min="0" data-max="10" data-start="0"
                            data-one="Child" data-many="Children">
                            <div><strong>Children</strong><small>2 to 12 years</small></div>
                            <div class="counter">
                                <button class="counter-btn" type="button" data-action="dec"
                                    aria-label="Remove a child">&minus;</button>
                                <output>0</output>
                                <button class="counter-btn" type="button" data-action="inc"
                                    aria-label="Add a child">+</button>
                            </div>
                        </div>
                        <div class="picker-foot">
                            <p class="picker-hint" aria-live="polite"></p>
                            <button class="btn picker-done svc-submit" type="button">Done</button>
                        </div>
                    </div>
                </div>

                <div class="svc-field is-small">
                    <label class="svc-label" for="busSeat">Seat</label>
                    <div class="svc-control">
                        <i class="fa-solid fa-chair" aria-hidden="true"></i>
                        <select id="busSeat" name="seat">
                            <option value="standard">Standard</option>
                            <option value="premium">Premium</option>
                            <option value="sleeper">Sleeper</option>
                        </select>
                    </div>
                </div>

                <button class="btn btn-lg svc-submit svc-search" type="submit">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>Search buses
                </button>
            </div>
        </form>
    </section>

    <section class="svc-results container" id="results" aria-label="Search results">
        <div class="svc-results-head" id="resultsHead">
            <div>
                <h2>Search buses</h2>
                <p>Choose a route to see available coaches.</p>
            </div>
        </div>
        <div class="svc-list" id="resultsList"></div>
        <p class="svc-note">Sample results for layout only. Live schedules will come from the Spring Boot API.</p>
    </section>
</main>
