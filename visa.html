<title>Visa · Bleet</title>
<!-- body: <body class="theme-visa"> -->

<main id="main">
    <section class="svc-hero">
        <div class="container">
            <p class="kicker">Visa</p>
            <h1>Check your visa</h1>
            <p class="lead">See which visa you need, how long it takes and what it costs.</p>
        </div>
    </section>

    <section class="container">
        <form class="svc-panel" data-service-form="visa" novalidate aria-label="Visa search">
            <div class="svc-fields">
                <div class="svc-field is-wide">
                    <label class="svc-label" for="visaFrom">Your nationality</label>
                    <div class="svc-control">
                        <i class="fa-solid fa-passport" aria-hidden="true"></i>
                        <select id="visaFrom" name="from" required data-msg="Choose your nationality.">
                            <option value="">Select country</option>
                            <option>United States</option>
                            <option>United Kingdom</option>
                            <option>Germany</option>
                            <option>Canada</option>
                            <option>Australia</option>
                            <option>India</option>
                            <option>Brazil</option>
                            <option>Japan</option>
                            <option>Turkey</option>
                            <option>Egypt</option>
                            <option>Nigeria</option>
                        </select>
                    </div>
                    <span class="svc-error" aria-live="polite"></span>
                </div>

                <div class="svc-field is-wide">
                    <label class="svc-label" for="visaTo">Destination</label>
                    <div class="svc-control">
                        <i class="fa-solid fa-earth-europe" aria-hidden="true"></i>
                        <select id="visaTo" name="to" required data-msg="Choose a destination country.">
                            <option value="">Select country</option>
                            <option>France</option>
                            <option>Japan</option>
                            <option>United Arab Emirates</option>
                            <option>Turkey</option>
                            <option>Thailand</option>
                            <option>Italy</option>
                            <option>Spain</option>
                            <option>Canada</option>
                            <option>United States</option>
                            <option>Australia</option>
                        </select>
                    </div>
                    <span class="svc-error" aria-live="polite"></span>
                </div>

                <div class="svc-field">
                    <label class="svc-label" for="visaDate">Travel date</label>
                    <div class="svc-control">
                        <i class="fa-regular fa-calendar" aria-hidden="true"></i>
                        <input id="visaDate" name="date" type="date" data-offset="14" required
                            data-msg="Choose a travel date." data-msg-range="Date can't be in the past.">
                    </div>
                    <span class="svc-error" aria-live="polite"></span>
                </div>

                <div class="svc-field is-small">
                    <label class="svc-label" for="visaSpeed">Processing</label>
                    <div class="svc-control">
                        <i class="fa-solid fa-gauge-high" aria-hidden="true"></i>
                        <select id="visaSpeed" name="speed">
                            <option value="standard">Standard</option>
                            <option value="fast">Fast track</option>
                            <option value="express">Express</option>
                        </select>
                    </div>
                </div>

                <div class="svc-field is-full">
                    <span class="svc-label" id="visaTypeLabel">Visa type</span>
                    <div class="chips" role="radiogroup" aria-labelledby="visaTypeLabel">
                        <input type="radio" id="typeTourist" name="type" value="tourist" checked>
                        <label for="typeTourist"><i class="fa-solid fa-umbrella-beach"
                                aria-hidden="true"></i>Tourist</label>
                        <input type="radio" id="typeBusiness" name="type" value="business">
                        <label for="typeBusiness"><i class="fa-solid fa-briefcase"
                                aria-hidden="true"></i>Business</label>
                        <input type="radio" id="typeTransit" name="type" value="transit">
                        <label for="typeTransit"><i class="fa-solid fa-plane" aria-hidden="true"></i>Transit</label>
                        <input type="radio" id="typeStudent" name="type" value="student">
                        <label for="typeStudent"><i class="fa-solid fa-graduation-cap"
                                aria-hidden="true"></i>Student</label>
                    </div>
                </div>

                <button class="btn btn-lg svc-submit svc-search" type="submit">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>Check requirements
                </button>
            </div>
        </form>
    </section>

    <section class="svc-results container" id="results" aria-label="Visa options">
        <div class="svc-results-head" id="resultsHead">
            <div>
                <h2>Check requirements</h2>
                <p>Choose your nationality and destination to compare processing options.</p>
            </div>
        </div>
        <div class="svc-list" id="resultsList"></div>
        <p class="svc-note">Sample fees and times for layout only. Official requirements must be confirmed with the
            destination's embassy.</p>
    </section>
</main>
